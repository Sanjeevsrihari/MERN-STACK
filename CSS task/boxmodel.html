<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <div class="container" >
        <div class="margin-box">
            Margin
            <div class="border-box">
                Border
                <div class="padding-box">
                    Padding
                    <div class="content-box">
                        Content
                    </div>
                </div>
            </div>
        </div>

        <div class="parent-box" styles="position:fixed; bottom:0pxs;">
            <b>parent</b>
            <div class="child-box hello-box" ;>
                <b>Hello</b>
            </div>
            <div class="child-box world-box">
                <b>World</b>
            </div>
        </div>
    </div>
</body>
</html>
